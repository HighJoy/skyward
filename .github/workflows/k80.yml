name: K80

# The fork builds one phone: the REDMI K80, whose configuration is
# devices/zorn.toml. The steps are the ones Build takes for every device in
# devices/, with the device fixed, so that each push is linted, tested and
# made into a flashable image without the other phones' stock packages
# being fetched. Build itself is left disabled on the fork.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k80-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      # What fails, said so that it can be read from the run's own record:
      # the whole log needs an account, a note does not.
      - name: Say what failed
        if: failure()
        shell: bash
        run: |
          cargo test --locked --workspace --no-fail-fast 2>&1 |
            grep -E "FAILED|panicked at|left:|right:|^---- .* stdout ----" | head -24 |
            while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked --workspace --all-targets -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      # What a program of the phone's built against a newer Android asks
      # its libraries for that the recovery's have not, so that the
      # phone's own element service starts where it otherwise ends a
      # second at a time. Laid where the configuration looks for it.
      - name: Build the entry points a newer Android has
        run: |
          cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-hal-shim
          mkdir -p tools/ramdisk/skyward/lib
          cp target/aarch64-linux-android/release/libskyward_hal_shim.so tools/ramdisk/skyward/lib/
      - name: Gather them
        run: |
          mkdir -p tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  recovery:
    name: Recovery for zorn
    needs: [tools]
    runs-on: ubuntu-24.04
    env:
      DEVICE: zorn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      - name: Read the stock build the recovery is made on
        id: stock
        run: tools/skyward-pack stock --config "devices/$DEVICE.toml" >> "$GITHUB_OUTPUT"
      # Only what the recovery partition takes is read of the package,
      # which is several gigabytes in all.
      - name: Restore the stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      - name: Take the recovery partition out of the stock package
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/skyward-pack stock --config "devices/$DEVICE.toml" --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        id: pack
        env:
          STOCK: ${{ steps.stock.outputs.version }}
        run: |
          name="skyward-${GITHUB_SHA::7}-$DEVICE-$STOCK"
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --extra tools/ramdisk --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
