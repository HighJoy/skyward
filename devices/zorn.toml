[device]
codename = "zorn"
brand = "Redmi"
model = "REDMI K80"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, vendor.display.default_resolution in the odm
# partition's build.prop: 1440 by 3200. persist.sys.miui_resolution gives
# the mode and the density the system runs in on this phone, 1440 by 3200
# at 600.
width = 1440
height = 3200
density = 600
diagonal = 6.67
# The radius the stock settings round a page's corners to as it slides in:
# the 13 Ultra's, whose panel is cut to the same corners.
corner_radius = 140

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: FocalTech's, over SPI behind Xiaomi's touch layer, the
# one touch driver the phone's own modules.load lists.
load = ["focaltech_touch"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's FocalTech one.
[touch]
# Told to follow the panel into its low-power rest, this controller does not
# come back with it: the screen goes dark and nothing is left to wake it but
# the power key. So the panel is left on, lit with a black frame, and only
# the backlight goes dark — a touch anywhere lights it again.
rests = false
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# The firmware the WLAN chip's driver loads is on the modem partition, which
# the phone's own table mounts at /vendor/firmware_mnt with the wait flag. A
# recovery runs none of init's boots, so the recovery mounts it itself, and
# shows it where its own firmware loader looks.
[firmware]
partition = "modem"

# The persist partition, at /mnt/vendor/persist in the phone's own table. The
# secure world keeps its own files there through a listener qseecomd
# registers: among them what the key service needs to use a key that cannot
# be rolled back, such as the one guarding each user's secret. The WLAN's
# MAC address is there as well.
[partitions]
mounted = ["persist"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one WLAN driver the phone's own modules.blocklist leaves of those its
# modules.load lists. Its cfg80211 asks for rfkill, one of the kernel's own
# modules in system_dlkm, as the 17 Ultra's does. Its recovery covers the
# vendor partition's firmware folder with the modem's, as the 13 Ultra's
# does, so the settings are given to the loader again, from the vendor
# partition. The address the vendor's other link names is not on this
# phone: persist/wlan holds nothing, and the driver takes the address from
# the chip, so nothing is placed for it — a file that is not there would
# stop the bring-up. wpa_supplicant runs on the recovery's own libraries
# before the vendor partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS4.0.3.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS4.0.3.0.XOKCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.3.0.XOKCNXM/zorn-ota_full-OS4.0.3.0.XOKCNXM-user-17.0-3e3ae497fc.zip"
recovery = "c0ca7a533fcacc09d693066179671e4968c8e2e4fc8a7a76f3b22cd2316902c9"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration, as on the 17 Ultra.
# And what of the data partition a backup leaves out because the secure world
# keeps it in step with itself: its own storage, its apps' data, that of
# Xiaomi's own trusted environment, the secure element's state and the
# fingerprint templates of either maker the phone may carry.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/mitee",
    "vendor/goodix",
    "vendor/fpc",
    "vendor/fingerprint",
    "vendor/fpdata",
    "vendor/misc/mi_fp",
]

# Where the phone's own programs keep logs in the data partition: the
# system's, the minidumps, what Xiaomi's log manager keeps of each part of
# the phone, and what the modem, Wi-Fi and Bluetooth leave when they crash.
[wipe]
logs = [
    "/data/miuilog",
    "/data/vendor/diag",
    "/data/vendor/bsplog",
    "/data/vendor/log",
    "/data/vendor/ramdump",
    "/data/vendor/ramdump_ssr",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wlan_logs",
]
